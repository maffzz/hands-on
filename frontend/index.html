<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: .8rem; font-weight: 600; }
    input { width: 100%; padding: .5rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .5rem 1rem; cursor: pointer; }
    #msg { margin-top: 1rem; }
    .ok { color: #1a7f37; } .err { color: #c62828; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: .9rem; }
    th, td { border: 1px solid #ccc; padding: .3rem .5rem; text-align: left; }
  </style>
</head>
<body>
  <h1>Registro</h1>

  <form id="form">
    <label for="nombres">Nombres</label>
    <input id="nombres" name="nombres" required>

    <label for="apellidos">Apellidos</label>
    <input id="apellidos" name="apellidos" required>

    <label for="correo">Correo</label>
    <input id="correo" name="correo" type="email" required>

    <label for="telefono">Teléfono (opcional)</label>
    <input id="telefono" name="telefono" type="tel">

    <button type="submit">Registrarme</button>
  </form>
  <div id="msg"></div>

  <hr>
  <button id="listar" type="button">Ver registros</button>
  <table id="tabla" hidden>
    <thead><tr><th>ID</th><th>Nombres</th><th>Apellidos</th><th>Correo</th><th>Teléfono</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    const msg = document.getElementById("msg");

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const datos = Object.fromEntries(new FormData(e.target));
      try {
        const r = await fetch("/registro", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos),
        });
        const json = await r.json();
        if (r.ok) {
          msg.className = "ok";
          msg.textContent = "Registrado con id " + json.id;
          e.target.reset();
        } else {
          msg.className = "err";
          msg.textContent = json.error || "Error";
        }
      } catch {
        msg.className = "err";
        msg.textContent = "No se pudo conectar con el servidor";
      }
    });

    document.getElementById("listar").addEventListener("click", async () => {
      const r = await fetch("/usuarios");
      const filas = await r.json();
      const tbody = document.querySelector("#tabla tbody");
      tbody.replaceChildren();
      for (const u of filas) {
        const tr = document.createElement("tr");
        for (const k of ["id", "nombres", "apellidos", "correo", "telefono"]) {
          const td = document.createElement("td");
          td.textContent = u[k] ?? "-";
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
      document.getElementById("tabla").hidden = false;
    });
  </script>
</body>
</html>
